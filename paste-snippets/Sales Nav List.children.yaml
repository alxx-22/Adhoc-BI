- TopRibbon_snl:
    Control: Image@2.2.3
    Properties:
      Height: =52
      Image: |-
        =With(
            {
                fn: With({r: First(Split(User().FullName, " ")).Value}, Substitute(Substitute(Substitute(If(Len(r) > 14, Left(r, 13) & "..", r), "&", "&amp;"), "<", "&lt;"), ">", "&gt;")),
                ini: Upper(Left(First(Split(User().FullName, " ")).Value, 1) & Left(Last(Split(User().FullName, " ")).Value, 1))
            },
            "data:image/svg+xml;utf8," & EncodeUrl("
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1136 52'>
        <desc>k=" & varAnimKey1 & "</desc>
        <defs><style>" & varSvgCss & "</style></defs>
        <rect x='0' y='0' width='1136' height='52' fill='#ffffff'/>
        <rect x='0' y='51' width='1136' height='1' fill='#d4d8db'/>
        <g class='fu'>
          <rect x='18' y='13' width='26' height='26' rx='7' fill='#01a982'/>
