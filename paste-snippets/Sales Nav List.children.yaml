- Gallery1:
    Control: Gallery@2.15.0
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Height: =470
      Items: |-
        =Filter(
            PowerBIIntegration.Data,
            If(
                showCC, 'Target Opp?' = "CC / Day 1 Upsell",
                showNSop, 'Target Opp?' = "No Services Op",
                showLPR, 'Target Opp?' = "Low Pen Rate",
                showtracking, !IsBlank(LookUp(colTrackedByMe, 'Opp ID' = 'HPE Opportunity Id')),
                showNEW, IsBlank(LookUp(colHasRecord, 'Opp ID' = 'HPE Opportunity Id')),
                true
            )
        )
      OnSelect: |-
        =Set(thisop,ThisItem.'HPE Opportunity Id');
        Set(varNavBusy, true); Set(varWipeKey, varWipeKey + 1);
        Navigate('Sales Nav op window', ScreenTransition.Fade)
      ShowScrollbar: =false
      TemplatePadding: =0
      TemplateSize: =59
      Transition: =Transition.Pop
      Width: =713
      X: =25
      Y: =94
    Children:
      - Image16:
          Control: Image@2.2.3
          Properties:
            Height: =55
            Image: |-
              =With(
                  {
                      aaRecord: LookUp(colHasRecord, 'Opp ID' = ThisItem.'HPE Opportunity Id'),
                      currentUser: User().Email
                  },
                  With(
                      {
                          hasRecord: !IsBlank(aaRecord),
                          isMine: !IsBlank(aaRecord) && Lower(aaRecord.'Modified By'.Email) = Lower(currentUser),
                          isOtherUser: !IsBlank(aaRecord) && Lower(aaRecord.'Modified By'.Email) <> Lower(currentUser),
                          lastEditor: If(!IsBlank(aaRecord), aaRecord.'Modified By'.DisplayName, "")
                      },
                      With(
                          {
                              cardFill: If(isMine, "#d1ffee", "#ffffff"),
                              cardStroke: If(isMine, "#01a982", "#d4d8db"),
                              strokeW: If(isMine, "2", "1"),
                              cleanName: Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(
                                      If(Len(ThisItem.'Opportunity Name') > 52, Left(ThisItem.'Opportunity Name', 52) & "..", ThisItem.'Opportunity Name'),
                                      "&", "&amp;"), "'", " "), "'", " "), """", " "), "<", "&lt;"), ">", "&gt;"), "#", ""), "%", ""),
                              cleanAcc: Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(
                                      If(Len(ThisItem.'Account Name') > 56, Left(ThisItem.'Account Name', 56) & "..", ThisItem.'Account Name'),
                                      "&", "&amp;"), "'", " "), "'", " "), """", " "), "<", "&lt;"), ">", "&gt;"), "#", ""), "%", ""),
                              cleanType: Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(
                                  ThisItem.'Target Opp?',
                                  "&", "&amp;"), "'", " "), "'", " "), """", " "), "<", "&lt;"), ">", "&gt;"), "#", ""), "%", ""),
                              cleanEditor: Substitute(Substitute(Substitute(Substitute(Substitute(
                                      If(Len(If(!IsBlank(aaRecord), aaRecord.'Modified By'.DisplayName, "")) > 16, Left(If(!IsBlank(aaRecord), aaRecord.'Modified By'.DisplayName, ""), 16) & "..", If(!IsBlank(aaRecord), aaRecord.'Modified By'.DisplayName, "")),
                                      "&", "&amp;"), "'", " "), """", " "), "<", "&lt;"), ">", "&gt;")
                          },
                          "data:image/svg+xml;utf8," & EncodeUrl("
              <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 970 76'>
              <desc>k=" & varAnimKey1 & "</desc>
              <defs><style>" & varSvgCss & "</style>" & varShadowFilter & "</defs>
              <g class='rw'>
                <rect x='2' y='8' width='966' height='66' rx='14' fill='#000000' opacity='0.06' filter='url(#sh)'/>
                <rect x='2' y='4' width='966' height='66' rx='14' fill='" & cardFill & "' stroke='" & cardStroke & "' stroke-width='" & strokeW & "'/>
                <text x='22' y='32' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' font-weight='600' fill='#292d3a'>" & cleanName & "</text>
                <text x='22' y='54' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='12' fill='#606a70'>" & cleanAcc & "</text>
                <line x1='522' y1='16' x2='522' y2='58' stroke='#d4d8db' stroke-width='1'/>
                <text x='540' y='44' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='13' font-weight='600' fill='#3e4550'>" & cleanType & "</text>
                <text x='700' y='44' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='15' font-weight='700' fill='#006750'>" &
                  If(IfError(ThisItem.'Products', 0) = 0, "-", Text(IfError(ThisItem.'Products', 0), "$#,##0")) & "</text>
                <text x='830' y='44' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='15' font-weight='700' fill='#006750'>" &
                  If(
                      IfError(ThisItem.'Services OS', 0) + IfError(ThisItem.'Services Non OS', 0) = 0,
                      "-",
                      Text(Value(IfError(ThisItem.'Services OS', 0) + IfError(ThisItem.'Services Non OS', 0)), "$#,##0")
                  ) & "</text>
              " & If(
                  isMine,
                  "<g class='pp' style='animation-delay:.25s'><rect x='896' y='12' width='58' height='20' rx='10' fill='#01a982'/><text x='925' y='26' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='10' font-weight='700' fill='#ffffff' text-anchor='middle'>YOURS</text></g>",
                  If(
                      isOtherUser,
                      "<g class='fo' style='animation-delay:.25s'><rect x='790' y='10' width='168' height='20' rx='10' fill='#f2f3f4'/><text x='874' y='24' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='10' font-weight='600' fill='#606a70' text-anchor='middle'>&#9998; " & cleanEditor & "</text></g>",
                      "<g class='pp' style='animation-delay:.25s'><rect x='904' y='12' width='50' height='20' rx='10' fill='#d1ffee'/><text x='929' y='26' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='10' font-weight='700' fill='#006750' text-anchor='middle'>NEW</text></g>"
                  )
              ) & "
              </g>
              </svg>")
                      )
                  )
              )
            ImagePosition: =ImagePosition.Fit
            OnSelect: |-
              =Set(thisop, ThisItem.'HPE Opportunity Id');
              Set(varNavBusy, true); Set(varWipeKey, varWipeKey + 1);
              Navigate('Sales Nav op window', ScreenTransition.Cover)
            Width: =713
            X: =0
            Y: =2
