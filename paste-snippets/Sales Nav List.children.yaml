- close button_1:
    Control: Image@2.2.3
    Properties:
      Height: =37
      Image: |-
        ="data:image/svg+xml;utf8," & EncodeUrl("
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 37 37'>
        <desc>k=" & varAnimKey3 & "</desc>
        <defs><style>" & varSvgCss & "</style></defs>
        <g class='pp' style='animation-delay:.6s'>
          <circle cx='18' cy='19' r='15' fill='#01a982'/>
          <path d='M12 13 L24 25 M24 13 L12 25' stroke='#ffffff' stroke-width='2.4' stroke-linecap='round'/>
        </g>
        </svg>")
      ImagePosition: =ImagePosition.Fit
      OnSelect: |-
        =Set(notibox, false);
        With(
            {
                existingRecord: LookUp('Attach App Noti Wizard Choices', 'User Email' = varUserEmail)
            },
            If(
                !IsBlank(existingRecord),
                Patch(
                    'Attach App Noti Wizard Choices',
                    existingRecord,
                    {
                        'User Email': varUserEmail,
                        'Product Delta Threshold': Value(productdelta.Value),
                        'Services Delta Threshold': Value(servicedelta.Value),
                        'noti on off': Text(notis.Selected.Value),
                        'new op noti': Text(newopnoti.Selected.Value)
                    }
                ),
                Patch(
                    'Attach App Noti Wizard Choices',
                    Defaults('Attach App Noti Wizard Choices'),
                    {
                        'User Email': varUserEmail,
                        'Product Delta Threshold': Value(productdelta.Value),
                        'Services Delta Threshold': Value(servicedelta.Value),
                        'noti on off': Text(notis.Selected.Value),
                        'new op noti': Text(newopnoti.Selected.Value)
                    }
                )
            )
        )
