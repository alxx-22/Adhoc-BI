- Image50:
    Control: Image@2.2.3
    Properties:
      Height: =164
      Image: |-
        =With(
            {
                myRec:     LookUp(colEngagementRanked, UniqueUser = User().Email),
                isChannel: LookUp(colEngagementRanked, UniqueUser = User().Email).Manager = "melissa.pugh@hpe.com"
            },
            With(
                {
                    tp:   Round(IfError(Value(myRec.IBNSPoints), 0) + IfError(Value(myRec.AttachUpsellPoints), 0) + IfError(Value(myRec.BacklogPoints), 0) + IfError(Value(myRec.LeadingEdgeCompletionPoints), 0), 0),
                    t2:   If(isChannel, 150, 300),
                    t3:   If(isChannel, 200, 500),
                    team: If(isChannel, "CHANNEL", "DIRECT")
                },
                With(
                    {
                        rn:   If(tp >= t3, "Services Master", If(tp >= t2, "Services Expert", If(tp >= 100, "Services Professional", "Unranked"))),
                        nx:   If(tp >= t3, "", If(tp >= t2, "Services Master", If(tp >= 100, "Services Expert", "Services Professional"))),
                        ptn:  If(tp >= t3, 0, If(tp >= t2, t3 - tp, If(tp >= 100, t2 - tp, 100 - tp))),
                        strs: If(tp >= t3, "&#9733;&#9733;&#9733;&#9733;&#9733;", If(tp >= t2, "&#9733;&#9733;&#9733;&#9733;&#9734;", If(tp >= 100, "&#9733;&#9734;&#9734;&#9734;&#9734;", "&#9734;&#9734;&#9734;&#9734;&#9734;"))),
                        bfwV: Round(If(tp >= t3, 280, If(tp >= t2, 187 + 93*((tp-t2)/(t3-t2)), If(tp >= 100, 93 + 94*((tp-100)/(t2-100)), 93*tp/100))), 0)
                    },
                    "data:image/svg+xml;utf8," & EncodeUrl("
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 328'>
        <desc>k=" & varAnimKey1 & " t=" & Text(tp) & "</desc>
        <defs><style>" & varSvgCss & "</style>" & varShadowFilter & "</defs>
        <g class='fu' style='animation-delay:.1s'>
          <rect x='0' y='8' width='760' height='316' rx='16' fill='#000000' opacity='0.08' filter='url(#sh)'/>
          <rect x='0' y='4' width='760' height='316' rx='16' fill='#d1ffee' stroke='#01a982' stroke-width='2'/>
          <g class='pp' style='animation-delay:.4s'>
            <rect x='648' y='22' width='90' height='34' rx='17' fill='#01a982'/>
            <text x='693' y='45' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' font-weight='700' fill='#ffffff' text-anchor='middle'>YOURS</text>
          </g>
          <text x='36' y='48' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' letter-spacing='3' fill='#606a70'>ATTAINMENT &#183; " & team & "</text>
          <text x='36' y='120' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='56' font-weight='700' fill='#006750' class='fo' style='animation-delay:.3s'>" & Text(tp) & "</text>
          <text x='36' y='146' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='16' font-weight='700' letter-spacing='2' fill='#606a70'>TOTAL POINTS</text>
          <text x='340' y='84' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='15' font-weight='700' letter-spacing='2' fill='#606a70'>CURRENT RANK</text>
          <text x='340' y='118' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='23' font-weight='700' fill='#292d3a' class='fo' style='animation-delay:.4s'>" & rn & "</text>
          <text x='340' y='148' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='19' fill='#E0A300' class='fo' style='animation-delay:.5s'>" & strs & "</text>
          <rect x='60' y='208' width='560' height='14' rx='7' fill='#ffffff' stroke='#d4d8db' stroke-width='1'/>
          <rect x='60' y='208' width='" & Text(bfwV * 2) & "' height='14' rx='7' fill='#01a982' class='gx' style='animation-delay:.5s'/>
          <circle cx='" & Text(60 + bfwV * 2) & "' cy='215' r='11' fill='#ffffff' stroke='#01a982' stroke-width='3' class='pp' style='animation-delay:1s'/>
          <g class='fo' style='animation-delay:.7s'>
            <text x='60' y='250' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='13' font-weight='700' letter-spacing='1' fill='#606a70'>START</text>
            <text x='246' y='250' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='13' font-weight='700' letter-spacing='1' fill='#606a70' text-anchor='middle'>PRO</text>
            <text x='246' y='268' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='12' fill='#606a70' text-anchor='middle'>100</text>
            <text x='434' y='250' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='13' font-weight='700' letter-spacing='1' fill='#606a70' text-anchor='middle'>EXPERT</text>
            <text x='434' y='268' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='12' fill='#606a70' text-anchor='middle'>" & Text(t2) & "</text>
            <text x='620' y='250' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='13' font-weight='700' letter-spacing='1' fill='#606a70' text-anchor='end'>MASTER</text>
            <text x='620' y='268' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='12' fill='#606a70' text-anchor='end'>" & Text(t3) & "</text>
          </g>
          " & If(
              ptn > 0,
              "<g class='pp' style='animation-delay:1.1s'><rect x='36' y='282' width='300' height='30' rx='15' fill='#ffffff' stroke='#d4d8db' stroke-width='1'/><text x='186' y='302' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#006750' text-anchor='middle'>" & Text(ptn) & " pts to " & nx & "</text></g>",
              "<g class='pp' style='animation-delay:1.1s'><rect x='36' y='282' width='300' height='30' rx='15' fill='#FBF1D6'/><text x='186' y='302' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#B5742E' text-anchor='middle'>&#9733; MAX RANK ACHIEVED &#9733;</text></g>"
          ) & "
        </g>
        </svg>")
                )
            )
        )
      ImagePosition: =ImagePosition.Fit
      Width: =380
      X: =24
      Y: =122
