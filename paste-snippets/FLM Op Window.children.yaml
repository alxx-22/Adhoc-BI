- Image17_4:
    Control: Image@2.2.3
    Properties:
      Height: =30
      Image: |-
        ="data:image/svg+xml;utf8," & EncodeUrl("
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 68 30'>
        <desc>k=" & varAnimKey1 & " s=" & Text(Container2Visible) & "</desc>
        <defs><style>" & varSvgCss & "</style></defs>
        <g class='pp' style='animation-delay:.35s'>
          <rect x='1' y='1' width='66' height='28' rx='14' fill='" & If(Container2Visible, "#01a982", "#ffffff") & "' stroke='" & If(Container2Visible, "#01a982", "#d4d8db") & "' stroke-width='1'/>
          <text x='34' y='19' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='9.5' font-weight='700' fill='" & If(Container2Visible, "#ffffff", "#006750") & "' text-anchor='middle'>Line Items</text>
        </g>
        </svg>")
      ImagePosition: =ImagePosition.Fit
      OnSelect: |-
        =Set(selectedTab, "Products");
        ClearCollect(
            productCollection,
            ForAll(
                Split(First(Filter(PowerBIIntegration.Data, 'HPE Opportunity Id' = thisop)).'Packed Products', " || "),
                With(
                    {
                        gbuVal: First(Split(Value, "//")).Value,
                        prodVal: Index(Split(Value, "//"), 2).Value,
                        numVal: IfError(Value(Trim(Last(Split(Value, "//")).Value)), 0)
                    },
                    {
            GBU: gbuVal,
            ProductName: prodVal,
            ProductValue: numVal,
            borderColor: With(
                {pl: LookUp('FY26_BA_Hierarchy', 'PL Code' = Left(prodVal, 2), PLCODELOOK)},
                If(
                    pl = "Service OS", "#00E0AF",
                    pl = "Service Non OS", "#62E5F6",
                    "#ffffff"
                )
            ),
            isProduct: With(
                {pl: LookUp('FY26_BA_Hierarchy', 'PL Code' = Left(prodVal, 2), PLCODELOOK)},
                pl = "Product"
            )
        }
                )
            )
        );
        Set(showProductContainer, true);
        Set(Container1Visible, false);
        Set(Container2Visible, true);
        Set(Container3Visible, false);
        Set(varAnimKey3, varAnimKey3 + 1);
        Set(varProductListHeight, Min(CountRows(productCollection) * 45 + 65, 465));
        Set(varProdToggle, 0);
        Set(showProducts, false);
        Set(showOS, false);
        Set(showNonOS, false);
        Set(varOSToggle, 0);
        Set(varNonOSToggle, 0);
      Width: =65
      X: =966
      Y: =120
- Image17_5:
    Control: Image@2.2.3
    Properties:
      Height: =30
      Image: |-
        ="data:image/svg+xml;utf8," & EncodeUrl("
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 68 30'>
        <desc>k=" & varAnimKey1 & " s=" & Text(Container1Visible) & "</desc>
        <defs><style>" & varSvgCss & "</style></defs>
        <g class='pp' style='animation-delay:.42s'>
          <rect x='1' y='1' width='66' height='28' rx='14' fill='" & If(Container1Visible, "#01a982", "#ffffff") & "' stroke='" & If(Container1Visible, "#01a982", "#d4d8db") & "' stroke-width='1'/>
          <text x='34' y='19' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='9.5' font-weight='700' fill='" & If(Container1Visible, "#ffffff", "#006750") & "' text-anchor='middle'>GBU Chart</text>
        </g>
        </svg>")
      ImagePosition: =ImagePosition.Fit
      OnSelect: |-
        =ClearCollect(
            gbuCollection,
            Filter(
                ForAll(
                    Split(First(Filter(PowerBIIntegration.Data, 'HPE Opportunity Id' = thisop)).'Packed GBU Totals', " || "),
                    {
                        GBU: Trim(First(Split(Value, "//")).Value),
                        GBUValue: IfError(Value(Trim(Last(Split(Value, "//")).Value)), 0)
                    }
                ),
                GBU <> ""
            )
        );
        Set(Container2Visible, false);
        Set(Container1Visible, true);
        Set(varAnimKey3, varAnimKey3 + 1);
        Set(Container3Visible, false);

        // Build chart (data logic unchanged; bar styling follows the design system)
        With(
            {
                filtered: Sort(Filter(gbuCollection, GBUValue > 0), GBUValue, SortOrder.Descending)
            },
            With(
                {
                    maxV: Max(filtered, GBUValue),
                    count: CountRows(filtered),
                    indexed: ForAll(
                        Sequence(CountRows(filtered)),
                        With(
                            {row: Index(filtered, Value)},
                            {
                                GBU: row.GBU,
                                GBUValue: row.GBUValue,
                                idx: Value - 1,
                                isSvc: Find("Services", row.GBU) > 0
                            }
                        )
                    )
                },
                Set(varChartHeight, count * 54 + 55);
                Set(
                    varChartBars,
                    Concat(
                        indexed,
                        With(
                            {
                                barW: If(maxV > 0, Round(ThisRecord.GBUValue / maxV * 280, 0), 0),
                                yP: 55 + ThisRecord.idx * 54,
                                del: Text(0.2 + ThisRecord.idx * 0.08, "[$-en-US]0.00"),
                                cleanName: Substitute(Substitute(Substitute(Substitute(Substitute(ThisRecord.GBU, "&", "&amp;"), "'", "&apos;"), """", "&quot;"), "<", "&lt;"), ">", "&gt;"),
                                valText: Text(ThisRecord.GBUValue, "$#,##0"),
                                barFill: If(ThisRecord.isSvc, "#04909d", "#0070f8")
                            },
                            "<g style='animation: fadeUp 0.4s cubic-bezier(0.2,0.7,0.2,1) " & del & "s both;'><text x='20' y='" & Text(yP + 16) & "' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='13' fill='#292d3a' font-weight='700'>" & cleanName & "</text><text x='20' y='" & Text(yP + 34) & "' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='11' fill='#606a70' font-weight='400'>" & valText & "</text></g><rect x='160' y='" & Text(yP + 2) & "' width='" & Text(barW) & "' height='30' rx='4' ry='4' fill='" & barFill & "' style='animation: barGrow 0.65s cubic-bezier(0.2,0.7,0.2,1) " & del & "s both; transform-origin: 160px " & Text(yP + 17) & "px;'/><text x='" & Text(160 + barW + 10) & "' y='" & Text(yP + 22) & "' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='12' fill='#006750' font-weight='700' style='animation: fadeUp 0.3s ease " & Text(Value(del) + 0.3, "[$-en-US]0.00") & "s both;'>" & valText & "</text>"
                        ),
                        ""
                    )
                )
            )
        )
      Width: =65
      X: =1049
      Y: =120
