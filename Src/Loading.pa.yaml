# ************************************************************************************************
# Attach Wizard - "Clean Enterprise Card" re-skin.
# Generated source: presentation restyled; all data logic preserved from the original app.
# ************************************************************************************************
Screens:
  Loading:
    Properties:
      Fill: =RGBA(247, 247, 247, 1)
      LoadingSpinnerColor: =RGBA(1, 169, 130, 1)
      OnVisible: |-
        =Set(varEntered, false);
        Set(varAnimKey1, If(IsBlank(varAnimKey1), 1, varAnimKey1 + 1));
    Children:
      - SplashCard_ld:
          Control: Image@2.2.3
          Properties:
            Height: =360
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl("
              <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 360'>
              <desc>k=" & varAnimKey1 & "</desc>
              <defs><style>" & varSvgCss & "</style>" & varShadowFilter & "</defs>
              <rect x='40' y='34' width='400' height='300' rx='16' fill='#000000' opacity='0.08' filter='url(#sh)'/>
              <rect x='40' y='30' width='400' height='300' rx='16' fill='#ffffff' stroke='#d4d8db' stroke-width='1'/>
              <g class='fu'>
                <rect x='214' y='64' width='52' height='52' rx='13' fill='#01a982'/>
                <text x='240' y='98' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='21' font-weight='700' fill='#ffffff' text-anchor='middle'>AW</text>
              </g>
              <text x='240' y='152' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='22' font-weight='700' fill='#292d3a' text-anchor='middle' class='fu' style='animation-delay:.08s'>Attach Wizard</text>
              <text x='240' y='174' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='10' font-weight='700' letter-spacing='2' fill='#606a70' text-anchor='middle' class='fu' style='animation-delay:.16s'>UKIMEA CSLV BI</text>
              <g class='fo' style='animation-delay:.3s'>
                <circle cx='240' cy='236' r='24' fill='none' stroke='#d4d8db' stroke-width='5'/>
                <circle cx='240' cy='236' r='24' fill='none' stroke='#01a982' stroke-width='5' stroke-linecap='round' stroke-dasharray='38 113' class='spin'/>
              </g>
              <text x='240' y='296' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='10' font-weight='600' fill='#606a70' text-anchor='middle' class='brz'>PREPARING YOUR PIPELINE DATA</text>
              </svg>")
            ImagePosition: =ImagePosition.Fit
            Width: =480
            X: =328
            Y: =110
      - EnterBtn_ld:
          Control: Image@2.2.3
          Properties:
            Height: =48
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl("
              <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 48'>
              <desc>k=" & varAnimKey1 & "</desc>
              <defs><style>" & varSvgCss & "</style></defs>
              <g class='pp' style='animation-delay:.9s'>
                <rect x='10' y='4' width='180' height='40' rx='20' fill='#01a982'/>
                <text x='100' y='29' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='14' font-weight='700' fill='#ffffff' text-anchor='middle'>Enter</text>
              </g>
              </svg>")
            ImagePosition: =ImagePosition.Fit
            OnSelect: |-
              =Set(varEntered, true);
              Set(varNavBusy, true); Set(varWipeKey, varWipeKey + 1);
              Navigate(Homepage, ScreenTransition.Fade)
            Width: =200
            X: =468
            Y: =486
      - tmrAutoEnter_ld:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            Duration: =600
            Height: =20
            OnTimerEnd: |-
              =If(
                  !varEntered && CountRows(PowerBIIntegration.Data) > 0,
                  Set(varEntered, true);
                  Set(varNavBusy, true); Set(varWipeKey, varWipeKey + 1);
                  Navigate(Homepage, ScreenTransition.Fade)
              )
            Repeat: =true
            Visible: =false
            Width: =40
            X: =0
            Y: =620
      - WipeOverlay_ld:
          Control: Image@2.2.3
          Properties:
            Height: =640
            Image: |-
              ="data:image/svg+xml;utf8," & EncodeUrl("
              <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1136 640' preserveAspectRatio='none'>
              <desc>k=" & varWipeKey & "</desc>
              <defs>
                <style>
                  @keyframes wp{0%{transform:translateX(-112%)}38%{transform:translateX(0)}62%{transform:translateX(0)}100%{transform:translateX(112%)}}
                  @keyframes tmb{0%{transform:rotate(0deg) scale(.6);opacity:0}30%{opacity:1}80%{opacity:1}100%{transform:rotate(340deg) scale(1.1);opacity:0}}
                  .wp{animation:wp 1.1s cubic-bezier(.7,0,.3,1) both}
                  .tmb{animation:tmb 1.05s ease-in-out both;transform-origin:center;transform-box:fill-box}
                  @media(prefers-reduced-motion:reduce){.wp,.tmb{animation:none;opacity:0}}
                </style>
                <linearGradient id='wg' x1='0' y1='0' x2='1' y2='0'>
                  <stop offset='0' stop-color='#006750'/>
                  <stop offset='1' stop-color='#01a982'/>
                </linearGradient>
              </defs>
              <g class='wp'>
                <rect x='-60' y='0' width='1256' height='640' fill='url(#wg)'/>
                <ellipse cx='300' cy='170' rx='34' ry='14' fill='#7cf5cf' opacity='.5' class='tmb'/>
                <ellipse cx='840' cy='470' rx='40' ry='16' fill='#bdf5e4' opacity='.4' class='tmb' style='animation-delay:.08s'/>
                <ellipse cx='900' cy='150' rx='26' ry='11' fill='#7cf5cf' opacity='.35' class='tmb' style='animation-delay:.14s'/>
                <g class='tmb' style='animation-delay:.05s'>
                  <rect x='520' y='272' width='96' height='96' rx='24' fill='#ffffff'/>
                  <text x='568' y='334' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='38' font-weight='700' fill='#01a982' text-anchor='middle'>AW</text>
                </g>
              </g>
              </svg>")
            ImagePosition: =ImagePosition.Fill
            Visible: =varNavBusy
            Width: =1136
            X: =0
            Y: =0
      - tmrWipe_ld:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =varNavBusy
            Duration: =1100
            Height: =20
            OnTimerEnd: =Set(varNavBusy, false)
            Visible: =false
            Width: =40
            X: =0
            Y: =620
