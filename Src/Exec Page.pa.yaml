              <text x='0' y='36' font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size='17' font-weight='700' fill='#292d3a' class='fu' style='animation-delay:.08s'>Your <tspan fill='#01a982'>Exec Summary</tspan> is ready</text>
